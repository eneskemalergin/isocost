name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Run every check and retain the tested release archives
        type: boolean
        default: false
    outputs:
      version:
        description: Version defined in src/model.h
        value: ${{ jobs.checks.outputs.version }}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
      workflows: ${{ steps.changes.outputs.workflows }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          tests=true
          workflows=true
          if [[ "$RELEASE" != true && -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            tests=false
            workflows=false
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/*) tests=true; workflows=true ;;
                action.yml) workflows=true ;;
                # tests/run.sh parses the TOML examples in this page.
                wiki/Configuration.md) tests=true ;;
                *.md) ;;
                *) tests=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          printf 'tests=%s\nworkflows=%s\n' "$tests" "$workflows" >> "$GITHUB_OUTPUT"

      - name: Check version and release notes
        id: version
        env:
          RELEASE: ${{ inputs.release || false }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release.sh version)
          if [[ "$RELEASE" == true ]]; then
            bash .github/scripts/release.sh notes "$TAG" > /dev/null
          else
            bash .github/scripts/release.sh notes > /dev/null
          fi
          grep -q "\"isocost_version\": \"$version\"" wiki/Summary-JSON.md
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check shell scripts and Python
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
            shellcheck "$script"
          done < <(git ls-files -z '*.sh')
          python3 -m py_compile tools/gen_font.py

  workflows:
    name: Workflow checks
    needs: checks
    if: needs.checks.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow syntax
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -color

      - name: Check workflow and action security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .
          advanced-security: false
          online-audits: false
          annotations: true
          version: v1.30.1

  test:
    name: Test (${{ matrix.cc }})
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang qpdf libxml2-utils python3-pil

      - name: Build without warnings
        run: |
          set -euo pipefail
          "$CC" --version | head -1
          make CC="$CC" 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'warning:' "$RUNNER_TEMP/build.log"; then
            echo "::error::the build printed compiler warnings" >&2
            exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail
          make CC="$CC" test 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -q '^skip' "$RUNNER_TEMP/test.log"; then
            echo "::error::a test was skipped because a tool is missing" >&2
            exit 1
          fi

      - name: Check README figures
        run: |
          set -euo pipefail
          make CC="$CC" docs-images
          if ! git diff --exit-code --stat -- assets/; then
            echo "::error::assets/ differs from the figures this code draws; run make docs-images and commit assets/" >&2
            exit 1
          fi

  package:
    name: Release archive (${{ matrix.arch }})
    needs: checks
    if: needs.checks.outputs.tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CPU and container runtime
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          podman --version

      # make static builds with GCC and musl in a pinned Alpine image, so no
      # toolchain download depends on a third-party mirror.
      - name: Build and test release archive
        timeout-minutes: 10
        run: bash .github/scripts/release.sh package "$ARCH" "$RUNNER_TEMP/release"

      - name: Retain tested release archive
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [checks, workflows, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CHECKS: ${{ needs.checks.result }}
      TESTS_NEEDED: ${{ needs.checks.outputs.tests }}
      TESTS: ${{ needs.test.result }}
      PACKAGE: ${{ needs.package.result }}
      WORKFLOWS_NEEDED: ${{ needs.checks.outputs.workflows }}
      WORKFLOWS: ${{ needs.workflows.result }}
    steps:
      - name: Check required results
        run: |
          set -euo pipefail
          test "$CHECKS" = success
          for pair in "$TESTS_NEEDED:$TESTS" "$TESTS_NEEDED:$PACKAGE" "$WORKFLOWS_NEEDED:$WORKFLOWS"; do
            case "$pair" in
              true:success|false:skipped) ;;
              *) printf 'Required check did not pass: %s\n' "$pair" >&2; exit 1 ;;
            esac
          done

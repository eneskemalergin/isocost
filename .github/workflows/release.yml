name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    permissions:
      contents: read
    # actionlint 1.7.12 cannot validate GitHub's newer $/ workflow calls yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      release: true

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Publish archives, checksums, and changelog entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/release.sh notes "$TAG" > "$RUNNER_TEMP/release-notes.md"
          cd "$RUNNER_TEMP/release"
          archives=(
            "isocost-$VERSION-x86_64-linux.tar.gz"
            "isocost-$VERSION-aarch64-linux.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" "${archives[@]}" SHA256SUMS \
            --verify-tag --title "isocost $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
